workflows:
  ios-workflow:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    publishing:
      email:
        recipients:
          - helloacc223@outlook.com
    artifacts:
      - "*.ipa"
    scripts:
      - name: Initialize Xcode Project
        script: | 
          set -e
          # 1. Создаем Info.plist
          cat <<EOF > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Treadmill</string>
            <key>CFBundleIdentifier</key>
            <string>com.lario.treadmill</string>
            <key>CFBundleName</key>
            <string>Treadmill</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
          </dict>
          </plist>
          EOF

          # 2. Создаем проект Xcode
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          
          # Добавляем ТОЛЬКО код и сториборд. Info.plist НЕ добавляем как файл.
          ['TreadmillApp.swift', 'LaunchScreen.storyboard'].each do |f|
            file_ref = project.new_file(f)
            target.add_file_references([file_ref])
          end
          
          target.build_configurations.each do |config| 
            s = config.build_settings
            s['INFOPLIST_FILE'] = 'Info.plist' # Просто указываем путь
            s['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.lario.treadmill'
            s['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            s['SWIFT_VERSION'] = '5.0'
            s['CODE_SIGNING_ALLOWED'] = 'NO'
            s['CODE_SIGNING_REQUIRED'] = 'NO'
            s['CODE_SIGN_IDENTITY'] = ''
            s['GENERATE_INFOPLIST_FILE'] = 'NO'
          end
          project.save
          "
      - name: Build and Package
        script: |
          set -e
          # Сборка архива
          xcodebuild archive \
            -project Treadmill.xcodeproj \
            -scheme Treadmill \
            -configuration Release \
            -archivePath build/Treadmill.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          # Создаем IPA
          mkdir -p Payload
          cp -R build/Treadmill.xcarchive/Products/Applications/Treadmill.app Payload/
          zip -r Treadmill.ipa Payload
          echo "Build successful! IPA is ready."