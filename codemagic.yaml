workflows:
  ios-workflow:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    publishing:
      email:
        recipients:
          - helloacc223@outlook.com
    artifacts:
      - "*.ipa" # Будем искать готовый пакет
    scripts:
      - name: Initialize Xcode Project
        script: | 
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          file = project.new_file('TreadmillApp.swift')
          target.add_file_references([file])
          project.save
          "
      - name: Build and Package
        script: |
          # Собираем в текущую папку (derivedDataPath .)
          xcodebuild build \
            -project Treadmill.xcodeproj \
            -scheme Treadmill \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath . \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Создаем структуру Payload для .ipa (это правильный формат для Sideloadly)
          mkdir -p Payload
          cp -R Build/Products/Release-iphoneos/Treadmill.app Payload/
          zip -r Treadmill.ipa Payload