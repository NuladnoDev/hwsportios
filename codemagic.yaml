workflows:
  ios-workflow:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    publishing:
      email:
        recipients:
          - helloacc223@outlook.com
    artifacts:
      - "*.ipa"
    scripts:
      - name: Initialize Xcode Project and Info.plist
        script: | 
          set -e
          # 1. Создаем минимальный Info.plist
          cat <<EOF > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Treadmill</string>
            <key>CFBundleIdentifier</key>
            <string>com.yourname.treadmill</string>
            <key>CFBundleName</key>
            <string>Treadmill</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
          </dict>
          </plist>
          EOF

          # 2. Создаем проект Xcode
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          file = project.new_file('TreadmillApp.swift')
          info_plist = project.new_file('Info.plist')
          target.add_file_references([file])
          target.build_configurations.each do |config| 
            config.build_settings['INFOPLIST_FILE'] = 'Info.plist'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.yourname.treadmill'
            config.build_settings['ASSETCATALOG_COMPILER_APPICON_NAME'] = 'AppIcon'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            config.build_settings['SWIFT_VERSION'] = '5.0'
          end
          project.save
          "
      - name: Build and Package
        script: |
          set -e
          # Собираем
          xcodebuild build \
            -project Treadmill.xcodeproj \
            -scheme Treadmill \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Находим .app
          APP_PATH=$(find build_output -name "Treadmill.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Treadmill.app not found!"
            exit 1
          fi

          # Проверяем наличие исполняемого файла
          if [ ! -f "$APP_PATH/Treadmill" ]; then
            echo "Error: Executable 'Treadmill' not found in $APP_PATH"
            ls -R "$APP_PATH"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Treadmill.ipa Payload
          echo "Success! IPA created."
