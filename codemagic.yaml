workflows:
  ios-workflow:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    artifacts:
      - build/ios/iphoneos/*.app
    scripts:
      - name: Initialize Xcode Project
        script: | 
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          file = project.new_file('TreadmillApp.swift')
          target.add_file_references([file])
          project.save
          "
      - name: Build Unsigned App
        script: |
          # Собираем без подписи (CODE_SIGNING_ALLOWED=NO)
          xcodebuild build \
            -project Treadmill.xcodeproj \
            -scheme Treadmill \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # Готовим папку для артефактов
          mkdir -p build/ios/iphoneos
          cp -R build/Release-iphoneos/Treadmill.app build/ios/iphoneos/Treadmill.app