workflows:
  ios-workflow:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    # Мы УБРАЛИ секцию integrations, чтобы он не искал ключи Apple
    publishing:
      email:
        recipients:
          - helloacc223@outlook.com
    artifacts:
      - build/ios/iphoneos/*.app.zip # Codemagic сам запакует .app в .zip
    scripts:
      - name: Initialize Xcode Project
        script: | 
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          file = project.new_file('TreadmillApp.swift')
          target.add_file_references([file])
          project.save
          "
      - name: Build Unsigned App
        script: |
          # Чистая сборка без подписи
          xcodebuild build \
            -project Treadmill.xcodeproj \
            -scheme Treadmill \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos
          
          # Создаем папку для результата
          mkdir -p build/ios/iphoneos
          # Упаковываем .app в zip, чтобы Codemagic его подхватил как артефакт
          cd build/Release-iphoneos && zip -r ../ios/iphoneos/Treadmill.app.zip Treadmill.app