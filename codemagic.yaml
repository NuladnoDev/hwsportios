workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: apple_developer_portal # Имя интеграции в настройках Codemagic (обычно по умолчанию)
    publishing:
      app_store_connect:
        auth: integration # Использует данные из подключенной интеграции
      email:
        recipients:
          - larionovnikita605@gmail.com # ЗАМЕНИ НА СВОЙ EMAIL
    scripts:
      - name: Initialize Xcode Project
        script: | 
          # Этот скрипт создает пустой проект Xcode вокруг твоего Swift файла
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          file = project.new_file('TreadmillApp.swift')
          target.add_file_references([file])
          project.save
          "
      - name: Build iOS App
        script: |
          xcodebuild build -project Treadmill.xcodeproj -scheme Treadmill -sdk iphoneos -configuration Release
