workflows:
  ios-workflow:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    publishing:
      email:
        recipients:
          - helloacc223@outlook.com
    artifacts:
      - "*.ipa"
    scripts:
      - name: Initialize Xcode Project and Info.plist
        script: | 
          # 1. Создаем минимальный Info.plist (без него приложение не соберется правильно)
          cat <<EOF > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>Treadmill</string>
            <key>CFBundleIdentifier</key>
            <string>com.yourname.treadmill</string>
            <key>CFBundleName</key>
            <string>Treadmill</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

          # 2. Создаем проект Xcode
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.new('Treadmill.xcodeproj')
          target = project.new_target(:application, 'Treadmill', :ios, '15.0')
          file = project.new_file('TreadmillApp.swift')
          info_plist = project.new_file('Info.plist')
          target.add_file_references([file])
          target.build_configurations.each { |config| config.build_settings['INFOPLIST_FILE'] = 'Info.plist' }
          project.save
          "
      - name: Build and Package
        script: |
          # Собираем
          xcodebuild build \
            -project Treadmill.xcodeproj \
            -scheme Treadmill \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Проверяем где лежит .app и пакуем в .ipa
          APP_PATH=\$(find build_output -name "Treadmill.app" -type d | head -n 1)
          echo "Found app at: \$APP_PATH"
          
          mkdir -p Payload
          cp -R "\$APP_PATH" Payload/
          zip -vr Treadmill.ipa Payload